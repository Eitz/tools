<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Z-Score Peso/Idade Infantil – OMS</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      :root {
        --bg-boy: #dbeafe;
        --bg-girl: #fce7f3;
        --accent-boy: #1d4ed8;
        --accent-girl: #be185d;
        --card-bg: #ffffff;
        --radius: 12px;
        --shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
      }

      body {
        font-family: "Segoe UI", system-ui, sans-serif;
        min-height: 100vh;
        transition: background 0.4s ease;
        padding: 24px 16px 48px;
      }

      body.boy {
        background: var(--bg-boy);
        --accent: var(--accent-boy);
      }
      body.girl {
        background: var(--bg-girl);
        --accent: var(--accent-girl);
      }

      /* ── Header ── */
      .header {
        max-width: 860px;
        margin: 0 auto 24px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        flex-wrap: wrap;
        gap: 12px;
      }

      .header h1 {
        font-size: 1.5rem;
        font-weight: 700;
        color: var(--accent);
        line-height: 1.3;
      }

      .header h1 span {
        font-size: 0.85rem;
        font-weight: 400;
        color: #555;
        display: block;
      }

      /* ── Toggle button ── */
      .toggle-btn {
        display: flex;
        align-items: center;
        gap: 10px;
        background: var(--accent);
        color: #fff;
        border: none;
        border-radius: 30px;
        padding: 10px 20px;
        font-size: 1rem;
        font-weight: 600;
        cursor: pointer;
        transition:
          background 0.3s,
          transform 0.1s;
        user-select: none;
        white-space: nowrap;
      }
      .toggle-btn:hover {
        filter: brightness(1.1);
      }
      .toggle-btn:active {
        transform: scale(0.97);
      }
      .toggle-btn .icon {
        font-size: 1.3rem;
      }

      /* ── Card ── */
      .card {
        max-width: 860px;
        margin: 0 auto 24px;
        background: var(--card-bg);
        border-radius: var(--radius);
        box-shadow: var(--shadow);
        padding: 24px;
      }

      /* ── Input row ── */
      .inputs {
        display: flex;
        flex-wrap: wrap;
        gap: 16px;
        align-items: flex-end;
        margin-bottom: 20px;
      }

      .field {
        display: flex;
        flex-direction: column;
        gap: 6px;
        flex: 1;
        min-width: 160px;
      }

      .field label {
        font-size: 0.85rem;
        font-weight: 600;
        color: #444;
      }

      .field input {
        padding: 10px 14px;
        border: 2px solid #e2e8f0;
        border-radius: 8px;
        font-size: 1rem;
        transition: border-color 0.2s;
        outline: none;
      }
      .field input:focus {
        border-color: var(--accent);
      }

      .calc-btn {
        background: var(--accent);
        color: #fff;
        border: none;
        border-radius: 8px;
        padding: 10px 28px;
        font-size: 1rem;
        font-weight: 700;
        cursor: pointer;
        transition:
          filter 0.2s,
          transform 0.1s;
        white-space: nowrap;
        align-self: flex-end;
      }
      .calc-btn:hover {
        filter: brightness(1.12);
      }
      .calc-btn:active {
        transform: scale(0.97);
      }

      /* ── Validation error ── */
      .errmsg {
        font-size: 0.85rem;
        color: #b45309;
        background: #fffbeb;
        border-radius: 6px;
        padding: 8px 12px;
        margin-bottom: 12px;
        display: none;
      }
      .errmsg.show {
        display: block;
      }

      /* ── Classification active row ── */
      .classif-row.active {
        font-weight: 800;
      }
      .classif-indicator {
        margin-left: auto;
        font-size: 0.82rem;
        font-weight: 700;
        display: none;
        align-items: center;
        gap: 4px;
        white-space: nowrap;
        opacity: 0.85;
      }
      .classif-row.active .classif-indicator {
        display: flex;
      }

      /* ── Chart ── */
      .chart-wrap {
        position: relative;
        height: 420px;
      }

      /* ── Classification guide ── */
      .classif-guide {
        margin-top: 20px;
        border-radius: 8px;
        overflow: hidden;
        border: 1px solid #e2e8f0;
      }
      .classif-row {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 10px 16px;
        font-size: 0.88rem;
        font-weight: 500;
        border-bottom: 1px solid #e2e8f0;
      }
      .classif-row:last-child {
        border-bottom: none;
      }
      .classif-badge {
        font-weight: 700;
        min-width: 160px;
        font-size: 0.82rem;
        font-family: monospace;
      }
      .classif-laranja {
        color: #c2410c;
        background: #fff7ed;
      }
      .classif-verde {
        color: #15803d;
        background: #f0fdf4;
      }
      .classif-vermelho {
        color: #dc2626;
        background: #fef2f2;
      }
      .classif-vermelho-escuro {
        color: #991b1b;
        background: #fee2e2;
      }

      /* ── Footer ── */
      .footer {
        max-width: 860px;
        margin: 0 auto;
        text-align: center;
        font-size: 0.78rem;
        color: #888;
      }

      @media (max-width: 500px) {
        .header h1 {
          font-size: 1.2rem;
        }
        .chart-wrap {
          height: 300px;
        }
      }
    </style>
  </head>
  <body class="boy">
    <!-- Header -->
    <div class="header">
      <h1>
        Z-Score Peso/Idade
        <span>0 – 24 meses</span>
      </h1>
      <button class="toggle-btn" id="toggleBtn" onclick="toggleSex()">
        <span class="icon" id="toggleIcon">♂</span>
        <span id="toggleLabel">Menino</span>
      </button>
    </div>

    <!-- Input card -->
    <div class="card">
      <div class="inputs">
        <div class="field">
          <label for="ageInput">Idade (meses) — 0 a 24</label>
          <input
            type="number"
            id="ageInput"
            min="0"
            max="24"
            step="1"
            placeholder="Ex: 12"
          />
        </div>
        <div class="field">
          <label for="weightInput">Peso (kg)</label>
          <input
            type="number"
            id="weightInput"
            min="1"
            max="40"
            step="0.1"
            placeholder="Ex: 9.5"
          />
        </div>
        <button class="calc-btn" onclick="calculate()">Calcular</button>
      </div>

      <!-- Validation error -->
      <div class="errmsg" id="errmsg"></div>

      <!-- Chart -->
      <div class="chart-wrap">
        <canvas id="growthChart"></canvas>
      </div>

      <!-- Classification guide -->
      <div class="classif-guide">
        <div class="classif-row classif-laranja" data-zone="elevado">
          <span class="classif-badge">&gt; +2 DP</span>
          Peso elevado para idade
          <span class="classif-indicator">◄ aqui</span>
        </div>
        <div class="classif-row classif-verde" data-zone="adequado">
          <span class="classif-badge">Entre &ge; &minus;2 DP e &le; +2 DP</span>
          Peso adequado para idade
          <span class="classif-indicator">◄ aqui</span>
        </div>
        <div class="classif-row classif-vermelho" data-zone="baixo">
          <span class="classif-badge">&ge; &minus;3 DP e &lt; &minus;2 DP</span>
          Baixo peso para idade
          <span class="classif-indicator">◄ aqui</span>
        </div>
        <div class="classif-row classif-vermelho-escuro" data-zone="muitobaixo">
          <span class="classif-badge">&lt; &minus;3 DP</span>
          Muito baixo peso para idade
          <span class="classif-indicator">◄ aqui</span>
        </div>
      </div>
    </div>

    <!-- Footer -->
    <div class="footer">
      <p></p>
    </div>

      /* ═══════════════════════════════════════════════════════════
     LMS FORMULAS
  ═══════════════════════════════════════════════════════════ */

      /** Calculate z-score from weight X, given LMS params */
      function calcZscore(X, L, M, S) {
        if (Math.abs(L) < 1e-6) return Math.log(X / M) / S;
        return (Math.pow(X / M, L) - 1) / (L * S);
      }

      /** Calculate weight for a given z-score Z, given LMS params (inverse) */
      function weightAtZ(Z, L, M, S) {
        if (Math.abs(L) < 1e-6) return M * Math.exp(S * Z);
        return M * Math.pow(1 + L * S * Z, 1 / L);
      }

      /** Standard normal CDF – Hart approximation */
      function normCDF(z) {
        const a1 = 0.254829592,
          a2 = -0.284496736,
          a3 = 1.421413741;
        const a4 = -1.453152027,
          a5 = 1.061405429,
          p = 0.3275911;
        const sign = z < 0 ? -1 : 1;
        const x = Math.abs(z) / Math.sqrt(2);
        const t = 1 / (1 + p * x);
        const poly = ((((a5 * t + a4) * t + a3) * t + a2) * t + a1) * t;
        return 0.5 * (1 + sign * (1 - poly * Math.exp(-x * x)));
      }

      /* ═══════════════════════════════════════════════════════════
     STATE
  ═══════════════════════════════════════════════════════════ */

      let isBoy = true;
      let myChart = null;
      let lastCalc = null; // stores last computed result for tooltip
      const MONTHS = Array.from({ length: 25 }, (_, i) => i); // 0–24

      /* ═══════════════════════════════════════════════════════════
     CHART CONFIG
  ═══════════════════════════════════════════════════════════ */

      // Zone bands: each fills to the previous dataset, creating colored areas between boundaries
      const ZONE_META = [
        {
          z: -3,
          bg: "rgba(185,28,28,0.22)",
          border: "#dc2626",
          dash: [5, 3],
          fill: "start",
        },
        {
          z: -2,
          bg: "rgba(239,68,68,0.18)",
          border: "#f97316",
          dash: [5, 3],
          fill: "-1",
        },
        {
          z: +2,
          bg: "rgba(34,197,94,0.18)",
          border: "#f97316",
          dash: [5, 3],
          fill: "-1",
        },
        {
          flatY: 30,
          bg: "rgba(249,115,22,0.18)",
          border: "transparent",
          dash: [],
          fill: "-1",
        },
      ];

      function buildCurveData(lmsTable, z) {
        return MONTHS.map((m) => {
          const [L, M, S] = lmsTable[m];
          return { x: m, y: parseFloat(weightAtZ(z, L, M, S).toFixed(3)) };
        });
      }

      function buildCurveDatasets(lmsTable) {
        const datasets = ZONE_META.map((meta) => ({
          label: meta.flatY != null ? "zone_top" : `zone_${meta.z}`,
          data:
            meta.flatY != null
              ? MONTHS.map((m) => ({ x: m, y: meta.flatY }))
              : buildCurveData(lmsTable, meta.z),
          borderColor: meta.border,
          backgroundColor: meta.bg,
          borderWidth: meta.border === "transparent" ? 0 : 1.5,
          borderDash: meta.dash,
          pointRadius: 0,
          pointHoverRadius: 0,
          tension: 0.35,
          fill: meta.fill,
        }));
        // Mediana – thin reference line drawn on top of all zones, no fill
        datasets.push({
          label: "Mediana",
          data: buildCurveData(lmsTable, 0),
          borderColor: isBoy ? "#16a34a" : "#15803d",
          backgroundColor: "transparent",
          borderWidth: 2,
          borderDash: [],
          pointRadius: 0,
          pointHoverRadius: 0,
          tension: 0.35,
          fill: false,
        });
        return datasets;
      }

      function initChart() {
        const ctx = document.getElementById("growthChart").getContext("2d");
        const lms = isBoy ? LMS_BOYS : LMS_GIRLS;

        const datasets = buildCurveDatasets(lms);
        // Child point dataset – use regular line with showLine:false (avoids mixed-type bugs in Chart.js 4)
        datasets.push({
          label: "Criança",
          data: [],
          borderColor: isBoy ? "#1d4ed8" : "#be185d",
          backgroundColor: isBoy ? "#1d4ed8" : "#be185d",
          pointRadius: 4,
          pointHoverRadius: 7,
          pointStyle: "circle",
          showLine: false,
        });

        myChart = new Chart(ctx, {
          type: "line",
          data: { datasets },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            interaction: { mode: "nearest", intersect: true },
            scales: {
              x: {
                type: "linear",
                min: 0,
                max: 24,
                title: {
                  display: true,
                  text: "Idade (meses)",
                  font: { size: 13, weight: "600" },
                  color: "#444",
                },
                ticks: {
                  stepSize: 3,
                  callback: (v) => (v % 3 === 0 ? v : ""),
                },
                grid: { color: "#e2e8f0" },
              },
              y: {
                title: {
                  display: true,
                  text: "Peso (kg)",
                  font: { size: 13, weight: "600" },
                  color: "#444",
                },
                grid: {
                  color: (ctx) =>
                    Number.isInteger(ctx.tick.value) ? "#cbd5e1" : "#eef0f3",
                },
                ticks: {
                  stepSize: 0.5,
                  callback: (v) => (Number.isInteger(v) ? v + " kg" : ""),
                },
              },
            },
            plugins: {
              legend: { display: false },
              tooltip: {
                filter: (item) => item.dataset.label === "Criança",
                callbacks: {
                  title: () => "",
                  label: (ctx) => {
                    if (ctx.dataset.label !== "Criança" || !lastCalc)
                      return null;
                    return [
                      `${lastCalc.sex}  ·  ${lastCalc.age} meses  ·  ${lastCalc.weight} kg`,
                      `Z-score: ${lastCalc.z}  ·  Percentil: ${lastCalc.pct}%`,
                      lastCalc.label,
                    ];
                  },
                },
              },
            },
          },
        });
      }

      function refreshChart() {
        if (!myChart) return;
        const lms = isBoy ? LMS_BOYS : LMS_GIRLS;
        const newDatasets = buildCurveDatasets(lms);
        newDatasets.push({
          label: "Criança",
          data: [], // cleared on toggle; user must recalculate for new sex
          borderColor: isBoy ? "#1d4ed8" : "#be185d",
          backgroundColor: isBoy ? "#1d4ed8" : "#be185d",
          pointRadius: 4,
          pointHoverRadius: 7,
          pointStyle: "circle",
          showLine: false,
        });
        myChart.data.datasets = newDatasets;
        myChart.update();
      }

      /* ═══════════════════════════════════════════════════════════
     TOGGLE BOY / GIRL
  ═══════════════════════════════════════════════════════════ */

      function toggleSex() {
        isBoy = !isBoy;
        document.body.className = isBoy ? "boy" : "girl";
        document.getElementById("toggleIcon").textContent = isBoy ? "♂" : "♀";
        document.getElementById("toggleLabel").textContent = isBoy
          ? "Menino"
          : "Menina";
        document.getElementById("errmsg").className = "errmsg";
        clearZoneHighlight();
        refreshChart();
      }

      /* ═══════════════════════════════════════════════════════════
     CALCULATE
  ═══════════════════════════════════════════════════════════ */

      function classify(z) {
        if (z > 2) return { zone: "elevado", label: "Peso elevado para idade" };
        if (z >= -2)
          return { zone: "adequado", label: "Peso adequado para idade" };
        if (z >= -3) return { zone: "baixo", label: "Baixo peso para idade" };
        return { zone: "muitobaixo", label: "Muito baixo peso para idade" };
      }

      function highlightZone(zone) {
        document
          .querySelectorAll(".classif-row")
          .forEach((r) => r.classList.remove("active"));
        const row = document.querySelector(`.classif-row[data-zone="${zone}"]`);
        if (row) {
          row.classList.add("active");
          row.scrollIntoView({ behavior: "smooth", block: "nearest" });
        }
      }

      function clearZoneHighlight() {
        document
          .querySelectorAll(".classif-row")
          .forEach((r) => r.classList.remove("active"));
        lastCalc = null;
      }

      function calculate() {
        const ageRaw = document.getElementById("ageInput").value.trim();
        const weightRaw = document.getElementById("weightInput").value.trim();
        const errEl = document.getElementById("errmsg");

        const showErr = (msg) => {
          errEl.textContent = "⚠️ " + msg;
          errEl.className = "errmsg show";
        };
        errEl.className = "errmsg"; // clear

        if (ageRaw === "" || weightRaw === "") {
          showErr("Preencha a idade e o peso.");
          return;
        }

        const age = parseInt(ageRaw, 10);
        const weight = parseFloat(weightRaw);

        if (isNaN(age) || age < 0 || age > 24) {
          showErr("Idade deve ser entre 0 e 24 meses.");
          return;
        }
        if (isNaN(weight) || weight <= 0 || weight > 60) {
          showErr("Peso inválido (use valores entre 1 e 60 kg).");
          return;
        }

        const lms = isBoy ? LMS_BOYS : LMS_GIRLS;
        const [L, M, S] = lms[age];
        const z = calcZscore(weight, L, M, S);
        const pct = (normCDF(z) * 100).toFixed(1);
        const { zone, label } = classify(z);
        const sex = isBoy ? "Menino" : "Menina";

        lastCalc = {
          sex,
          age,
          weight: weight.toFixed(2),
          z: z.toFixed(2),
          pct,
          label,
        };
        highlightZone(zone);

        // Update child point on chart
        const childIdx = myChart.data.datasets.length - 1;
        myChart.data.datasets[childIdx].data = [{ x: age, y: weight }];
        myChart.data.datasets[childIdx].borderColor = isBoy
          ? "#1d4ed8"
          : "#be185d";
        myChart.data.datasets[childIdx].backgroundColor = isBoy
          ? "#1d4ed8"
          : "#be185d";
        myChart.update();
      }

      /* Allow pressing Enter to calculate */
      document.addEventListener("keydown", (e) => {
        if (e.key === "Enter") calculate();
      });

      /* ═══════════════════════════════════════════════════════════
     INIT
  ═══════════════════════════════════════════════════════════ */
      window.addEventListener("DOMContentLoaded", initChart);
    </script>
  </body>
</html>
